<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon Snake</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #controlsHint {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border-radius: 6px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e8f0; background: rgba(20, 20, 30, 0.6);
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="controlsHint">
      Доведите змейку до зелёного куба, не задевая красные лучи<br />
      Перетаскивание сегмента — двигать змейку по полу<br />
      Shift + перетаскивание — поднять; отпустите высоко, чтобы змейка разбилась<br />
      Клик по сегменту — выбрать; кнопки на панели — перекрасить его
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
